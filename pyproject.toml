[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-ai"
version = "1.0.0"
description = "AI-powered Code Review Assistant for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mani", email = "myfamily9006@gmail.com"},
]
keywords = ["code-review", "static-analysis", "python", "linting", "quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.9"

[project.scripts]
codereview-ai = "src.cli:main"

[project.urls]
Homepage = "https://github.com/codereview-ai/codereview-ai"
Documentation = "https://codereview-ai.readthedocs.io"
Repository = "https://github.com/codereview-ai/codereview-ai"
Issues = "https://github.com/codereview-ai/codereview-ai/issues"

[tool.codereview]
max_line_length = 88
max_function_length = 50
max_cyclomatic_complexity = 10
fail_threshold = 70.0
report_format = "html"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
